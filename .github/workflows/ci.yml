name: lookOut CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  vision-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r vision/requirements.txt

      - name: Run vision tests
        run: |
          pytest vision/tests -v

  docker-build:
    runs-on: ubuntu-latest
    needs: vision-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build vision Docker image
        run: |
          docker build -t lookout-vision -f vision/Dockerfile .

      - name: Test vision Docker image
        run: |
          docker run --rm lookout-vision python -m pytest tests -v